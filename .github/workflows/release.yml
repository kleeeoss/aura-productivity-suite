name: Automated Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Draft Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Version Consistency
        run: npm run verify-version

      - name: Run Test Suite
        run: npm test

      - name: Build Tauri Application & Draft GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AURA v__VERSION__'
          releaseBody: 'Welcome to AURA v__VERSION__! Explore the release assets below for the Windows installer (.exe) and standalone binaries.'
          releaseDraft: true
          prerelease: false

      - name: Upload Standalone Binary to Draft Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "src-tauri/target/release/app.exe") {
            Copy-Item "src-tauri/target/release/app.exe" "AURA_standalone.exe"
            gh release upload ${{ github.ref_name }} "AURA_standalone.exe" --clobber
          }

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aura-windows-desktop
          path: |
            src-tauri/target/release/app.exe
            src-tauri/target/release/bundle/nsis/*.exe

