name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Version Parity
        run: npm run verify-version

      - name: Code Quality & Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Production TypeScript & Vite Build
        run: npm run build
